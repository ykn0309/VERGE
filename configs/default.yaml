run:
  seed: 42
  output_dir: runs/v2-fake
  test_workers: 1
dataset:
  implementation: jsonl
  config:
    paths:
      train: configs/data/demo_train.jsonl
      test: configs/data/demo_test.jsonl
models:
  default:
    backend: fake
    model: attempt_1_success
  roles: {}
modules:
  retrieval:
    implementation: fake
    config:
      top_l: 20
  selection:
    implementation: llm
    config:
      max_selected: 5
  application:
    implementation: semistructured_v2
    config:
      max_rounds: 2
      max_candidates: 1
      invalid_output_retries: 2
      input_bytes: 100000
      check_interval: 3
      error_window: 6
      error_threshold: 3
      q_threshold: 0.5
      min_replay: 3
      revision_enabled: true
  reliability:
    implementation: bayesian
    config: {}
store:
  implementation: local
  config:
    root_dir: artifacts
