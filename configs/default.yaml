# Offline transport smoke test only; fake vectors are not semantic embeddings.
run:
  output_dir: runs/learning-demo
  train_workers: 5
  test_workers: 5
  max_inflight_requests: 16
dataset:
  paths:
    train: configs/data/demo_train.jsonl
    test: configs/data/demo_test.jsonl
model:
  backend: fake
  model: repairable
embedding:
  backend: fake
clustering:
  reference_weight: 0.5
  task_threshold: 0.75
  experience_threshold: 0.75
  max_rounds: 5
retrieval:
  task_group_limit: 3
  historical: 6
  semantic: 4
selection:
  max_selected: 2
critic:
  max_candidates: 2
  max_rounds: 2
requests:
  retries: 2
  input_bytes: 100000
