run:
  seed: 42
  output_dir: runs/default

# 离线可运行的 Fake 示例；真实 API 配置见 configs/openai.example.yaml。
dataset:
  implementation: jsonl
  config:
    paths:
      train: configs/data/demo_train.jsonl
      test: configs/data/demo_test.jsonl

models:
  default:
    backend: fake
    model: attempt_1_success
  roles: {}

modules:
  retrieval:
    implementation: fake
    config:
      top_l: 20
  selection:
    implementation: llm
    config:
      max_selected: 5
      exploration_slots: 0
  revision:
    implementation: two_attempt_same_base
    config:
      max_attempts: 2
  revision_credit:
    implementation: operation_bound
    config:
      max_budget: 1.0
  reliability:
    implementation: beta
    config: {}

store:
  implementation: local
  config:
    root_dir: artifacts
