run:
  seed: 42
  output_dir: runs/default
  test_workers: 4  # 测试阶段并行数；设为 1 可顺序测试，训练始终顺序执行。

# 离线可运行的 Fake 示例；真实 API 配置见 configs/openai.example.yaml 或 configs/qwen3.5-flash.yaml。
dataset:
  implementation: jsonl
  config:
    paths:
      train: configs/data/demo_train.jsonl
      test: configs/data/demo_test.jsonl

models:
  default:
    backend: fake
    model: attempt_1_success
  roles: {}

modules:
  retrieval:
    implementation: fake
    config:
      top_l: 20
  selection:
    implementation: llm
    config:
      max_selected: 5
      exploration_slots: 0
  revision:
    implementation: critic_generator_dialogue
    config:
      max_attempts: 2
      invalid_output_retries: 2
  reliability:
    implementation: beta
    config: {}

store:
  implementation: local
  config:
    root_dir: artifacts
