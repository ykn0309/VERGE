# Plan68: fresh 200-task run; inherited credit and lambda=0.2 evolution penalty.
run:
  seed: 42
  output_dir: runs/helpsteer3-general-inherited-credit-qwen-flash-200
  test_workers: 1
  stop_after_train: 200
dataset:
  implementation: jsonl
  config:
    paths:
      train: runs/helpsteer3-general-consensus-data/train.jsonl
models:
  default:
    backend: openai_compatible
    model: qwen3.5-flash
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY_2
    enable_thinking: false
    timeout_seconds: 120
    max_retries: 2
  roles: {}
modules:
  retrieval:
    implementation: hybrid
    config:
      top_l: 20
      embedding_model: text-embedding-v4
      dimensions: 1024
      category_top_k: 10
      rrf_k: 60
      member_examples: 3
  selection:
    implementation: llm
    config:
      max_selected: 5
      input_bytes: 100000
      exploration_slots: 0
  application:
    implementation: immutable_atomic_evolution
    config:
      max_rounds: 2
      invalid_output_retries: 2
      organization_batch_size: 5
  reliability:
    implementation: beta
    config: {}
store:
  implementation: local
  config:
    root_dir: artifacts
