run:
  output_dir: runs/history-learning-general100-qwen-116
  train_workers: 5
  test_workers: 5
  max_inflight_requests: 16
dataset:
  paths:
    train: artifacts/general100-full112-inputs/train.jsonl
model:
  backend: openai_compatible
  model: qwen3.5-flash
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY_2
  timeout_seconds: 120
  max_retries: 2
  enable_thinking: false
embedding:
  backend: openai_compatible
  model: text-embedding-v4
  dimensions: 1024
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY_2
  timeout_seconds: 120
  max_retries: 2
clustering:
  reference_weight: 0.3
  task_threshold: 0.75
  experience_threshold: 0.75
  max_rounds: 5
retrieval:
  task_group_limit: 3
  historical: 6
  semantic: 4
selection:
  max_selected: 5
critic:
  max_candidates: 2
  max_rounds: 2
requests:
  retries: 2
  input_bytes: 100000
