# 当前经验抽象实验配置：按用户要求固定Flash非思考，提示词沿用当前版本。
# 历史Plus/思考配置仅留档；本配置不自动启动，使用新目录避免覆盖历史结果。
run:
  seed: 42
  output_dir: runs/rewardbench-chat-hard-qwen-experience-flash-30
  test_workers: 1
  stop_after_train: 30
dataset:
  implementation: jsonl
  config:
    paths:
      train: runs/rewardbench-chat-hard-data-full/train.jsonl
    prepare:
      implementation: rewardbench_chat_hard
      mode: full_train
      output_dir: runs/rewardbench-chat-hard-data-full
      revision: 168d848cdbbea9764fae4a544dc9ca1e6cca4931
      seed: 42
models:
  default:
    backend: openai_compatible
    model: qwen3.5-flash
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY_2
    enable_thinking: false
    timeout_seconds: 30
    max_retries: 2
  roles: {}
modules:
  retrieval:
    implementation: vector
    config:
      top_l: 20
      embedding_model: text-embedding-v4
      dimensions: 1024
  selection:
    implementation: llm
    config:
      max_selected: 5
      exploration_slots: 0
  application:
    implementation: critic_candidate_validation
    config:
      max_rounds: 2
      invalid_output_retries: 2
  reliability:
    implementation: beta
    config: {}
store:
  implementation: local
  config:
    root_dir: artifacts
