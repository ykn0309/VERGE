# 授权复测：证据组织与提示词校准后，同序前100条仅生成/判断/两轮修订。
# 原检索/筛选参数保留但不执行；不构造embedding客户端。
run:
  seed: 42
  output_dir: runs/rewardbench-chat-hard-qwen-revision-only-evidence-grounded-100
  test_workers: 1
  experience_enabled: false
  stop_after_train: 100
dataset:
  implementation: jsonl
  config:
    paths:
      train: runs/rewardbench-chat-hard-data-full/train.jsonl
    prepare:
      implementation: rewardbench_chat_hard
      mode: full_train
      output_dir: runs/rewardbench-chat-hard-data-full
      revision: 168d848cdbbea9764fae4a544dc9ca1e6cca4931
      seed: 42
models:
  default:
    backend: openai_compatible
    model: qwen3.5-flash
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY_2
    enable_thinking: false
    timeout_seconds: 30
    max_retries: 2
  roles: {}
modules:
  retrieval:
    implementation: vector
    config:
      top_l: 20
      embedding_model: text-embedding-v4
      dimensions: 1024
  selection:
    implementation: llm
    config:
      max_selected: 5
      exploration_slots: 0
  revision:
    implementation: critic_generator_dialogue
    config:
      max_attempts: 2
      invalid_output_retries: 2
  reliability:
    implementation: beta
    config: {}
store:
  implementation: local
  config:
    root_dir: artifacts
