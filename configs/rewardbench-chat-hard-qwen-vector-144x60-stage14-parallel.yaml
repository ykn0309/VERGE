# Stage 14: Critic 直接产出 analysis + operations；144 train + 60 test。
# 同源 Chat Hard 测试集已用于诊断，仅作为回归观察，不是独立无偏终测。
# 训练顺序执行，测试在冻结经验池下最多 4 条并行；使用现有固定划分。
run:
  seed: 42
  output_dir: runs/rewardbench-chat-hard-qwen-vector-144x60-stage14-parallel
  test_workers: 4

dataset:
  implementation: jsonl
  config:
    paths:
      train: runs/rewardbench-chat-hard-data-144x60/train.jsonl
      test: runs/rewardbench-chat-hard-data-144x60/test.jsonl
    prepare:
      implementation: rewardbench_chat_hard
      output_dir: runs/rewardbench-chat-hard-data-144x60
      revision: 168d848cdbbea9764fae4a544dc9ca1e6cca4931
      seed: 42
      per_subset: 34
      train_per_subset: 24
      preserve_splits_from: runs/rewardbench-chat-hard-data-144x60

models:
  default:
    backend: openai_compatible
    model: qwen3.5-flash
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY_2
    enable_thinking: false
    timeout_seconds: 30
    max_retries: 2
  roles: {}

modules:
  retrieval:
    implementation: vector
    config:
      top_l: 20
      embedding_model: text-embedding-v4
      dimensions: 1024
  selection:
    implementation: llm
    config:
      max_selected: 5
      exploration_slots: 0
  revision:
    implementation: critic_atomic_same_base
    config:
      max_attempts: 2
      invalid_output_retries: 2
  revision_credit:
    implementation: operation_bound
    config:
      max_budget: 1.0
  reliability:
    implementation: beta
    config: {}

store:
  implementation: local
  config:
    root_dir: artifacts
