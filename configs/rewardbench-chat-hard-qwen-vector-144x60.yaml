# Chat Hard 内部分割实验：六子集各 24 train + 10 test；与 12 条 smoke 测试分开运行。
# run 自动准备缺失数据、校验已有数据；现有数据和结果不重制。
# Embedding / Qwen 均从 DASHSCOPE_API_KEY_2 环境变量读取凭证。
run:
  seed: 42
  output_dir: runs/rewardbench-chat-hard-qwen-vector-144x60-resume1

dataset:
  implementation: jsonl
  config:
    paths:
      train: runs/rewardbench-chat-hard-data-144x60/train.jsonl
      test: runs/rewardbench-chat-hard-data-144x60/test.jsonl
    prepare:
      implementation: rewardbench_chat_hard
      output_dir: runs/rewardbench-chat-hard-data-144x60
      revision: 168d848cdbbea9764fae4a544dc9ca1e6cca4931
      seed: 42
      per_subset: 34
      train_per_subset: 24
      # 原 smoke 已删除；以当前数据固定成员归属，输出仍必须是全新目录。
      preserve_splits_from: runs/rewardbench-chat-hard-data-144x60

models:
  default:
    backend: openai_compatible
    model: qwen3.5-flash
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY_2
    enable_thinking: false
    timeout_seconds: 30
    max_retries: 2
  roles: {}

modules:
  retrieval:
    implementation: vector
    config:
      top_l: 20
      embedding_model: text-embedding-v4
      dimensions: 1024
  selection:
    implementation: llm
    config:
      max_selected: 5
      exploration_slots: 0
  revision:
    implementation: two_attempt_same_base
    config:
      max_attempts: 2
      invalid_output_retries: 2
  revision_credit:
    implementation: operation_bound
    config:
      max_budget: 1.0
  reliability:
    implementation: beta
    config: {}

store:
  implementation: local
  config:
    root_dir: artifacts
