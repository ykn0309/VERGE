# 向量召回版本；与原先的 FakeRetriever 实验分开保存，仍非官方榜单评测。
# Embedding 和 Qwen 均使用 models.default.api_key_env，密钥只从环境读取。
run:
  seed: 42
  output_dir: runs/rewardbench-chat-hard-qwen-vector

dataset:
  implementation: jsonl
  config:
    paths:
      train: runs/rewardbench-chat-hard-data/train.jsonl
      test: runs/rewardbench-chat-hard-data/test.jsonl

models:
  default:
    backend: openai_compatible
    model: qwen3.5-flash
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY_2
    enable_thinking: false
    timeout_seconds: 30
    max_retries: 2
  roles: {}

modules:
  retrieval:
    implementation: vector
    config:
      top_l: 20
      embedding_model: text-embedding-v4
      dimensions: 1024
  selection:
    implementation: llm
    config:
      max_selected: 5
      exploration_slots: 0
  revision:
    implementation: two_attempt_same_base
    config:
      max_attempts: 2
  revision_credit:
    implementation: operation_bound
    config:
      max_budget: 1.0
  reliability:
    implementation: beta
    config: {}

store:
  implementation: local
  config:
    root_dir: artifacts
