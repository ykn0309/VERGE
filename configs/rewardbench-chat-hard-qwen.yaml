# run 自动准备缺失的 Chat Hard 数据并复用已校验的数据；本配置不包含 API key。
# 仅作内部 train/test 试验，训练用到 Chat Hard，结果不能视为官方 RewardBench 榜单成绩。
run:
  seed: 42
  output_dir: runs/rewardbench-chat-hard-qwen

dataset:
  implementation: jsonl
  config:
    paths:
      train: runs/rewardbench-chat-hard-data/train.jsonl
      test: runs/rewardbench-chat-hard-data/test.jsonl
    prepare:
      implementation: rewardbench_chat_hard
      output_dir: runs/rewardbench-chat-hard-data
      revision: 168d848cdbbea9764fae4a544dc9ca1e6cca4931
      seed: 42
      per_subset: 2
      train_per_subset: 1

models:
  default:
    backend: openai_compatible
    model: qwen3.5-flash
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY_2
    enable_thinking: false
    timeout_seconds: 30
    max_retries: 2
  roles: {}

modules:
  retrieval:
    implementation: fake  # 仍非真实向量召回。
    config:
      top_l: 20
  selection:
    implementation: llm
    config:
      max_selected: 5
      exploration_slots: 0
  revision:
    implementation: critic_atomic_same_base
    config:
      max_attempts: 2
      invalid_output_retries: 2
  revision_credit:
    implementation: operation_bound
    config:
      max_budget: 1.0
  reliability:
    implementation: beta
    config: {}

store:
  implementation: local
  config:
    root_dir: artifacts
