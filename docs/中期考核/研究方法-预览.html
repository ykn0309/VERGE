<!doctype html><meta charset="utf-8"><style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden}svg{display:block}</style><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">研究方法：经验引导的 Rubric 生成与持续演化</title><desc id="desc">从经验池检索设计经验，生成评分标准并评价回答，结合偏好反馈与执行核对，积累候选经验、估计质量并通过回放验证修订，服务后续任务。此图为方法设计概览。</desc>
<defs><marker id="arrow" markerWidth="15" markerHeight="14" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 Z" fill="#111111"/></marker></defs>
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff" stroke="none" stroke-width="0"/>
<rect x="84" y="73" width="38" height="38" fill="#315795" stroke="none" stroke-width="0"/>
<text x="148" y="116" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="58" font-weight="700" fill="#315795" text-anchor="start">研究方法：经验引导的 Rubric 生成与持续演化</text>
<rect x="91" y="169" width="1738" height="112" fill="#d9e2f3" stroke="#233b65" stroke-width="1.8"/>
<text x="112" y="216" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#111111" text-anchor="start">方法概览：从偏好轨迹中提炼设计经验，指导新任务的 Rubric 生成；</text>
<text x="112" y="259" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#111111" text-anchor="start">在后续应用中积累反馈，持续维护经验质量与适用范围。</text>
<text x="106" y="341" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="33" font-weight="700" fill="#c00000" text-anchor="start">核心流程：生成—反馈—维护，形成跨任务的经验闭环</text>
<rect x="100" y="385" width="530" height="392" fill="white" stroke="#17243a" stroke-width="1.8"/>
<rect x="170" y="361" width="390" height="55" fill="#315795" stroke="#233b65" stroke-width="1.8"/>
<text x="365" y="400" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">① 经验引导生成</text>
<rect x="695" y="385" width="530" height="392" fill="white" stroke="#17243a" stroke-width="1.8"/>
<rect x="765" y="361" width="390" height="55" fill="#315795" stroke="#233b65" stroke-width="1.8"/>
<text x="960" y="400" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">② 应用与反馈</text>
<rect x="1290" y="385" width="530" height="392" fill="white" stroke="#17243a" stroke-width="1.8"/>
<rect x="1360" y="361" width="390" height="55" fill="#548235" stroke="#233b65" stroke-width="1.8"/>
<text x="1555" y="400" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">③ 经验积累与演化</text>
<text x="365" y="459" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#111111" text-anchor="middle">新任务及其要求</text>
<text x="365" y="497" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#555555" text-anchor="middle">生成时不预先查看两份候选回答</text>
<path d="M365 511 V539" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="133" y="552" width="464" height="88" fill="#eef1f6" stroke="#315795" stroke-width="1.4"/>
<text x="365" y="588" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#111111" text-anchor="middle">检索相关设计经验</text>
<text x="365" y="625" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#111111" text-anchor="middle">依据适用条件，选择可用经验</text>
<path d="M365 651 V678" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="365" y="716" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#111111" text-anchor="middle">结合任务生成 Rubric</text>
<text x="365" y="756" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#555555" text-anchor="middle">具体标准 ＋ 相对权重 ＋ 经验来源</text>
<text x="960" y="459" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#111111" text-anchor="middle">Judge 独立评价两份回答</text>
<text x="960" y="497" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#555555" text-anchor="middle">同一套标准，分别判断是否满足</text>
<path d="M960 511 V539" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="728" y="552" width="464" height="88" fill="#eef1f6" stroke="#315795" stroke-width="1.4"/>
<text x="960" y="588" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#111111" text-anchor="middle">加权评分，与数据集偏好对照</text>
<text x="960" y="625" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#111111" text-anchor="middle">汇总所引用经验的正向／反向／平局反馈</text>
<text x="726" y="687" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#111111" text-anchor="start">执行核对</text>
<text x="726" y="723" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#111111" text-anchor="start">选择是否适用 · 生成是否忠实</text>
<text x="726" y="758" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#111111" text-anchor="start">Judge 判断是否符合回答内容</text>
<text x="1315" y="457" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#111111" text-anchor="start">失败诊断 → 提炼经验</text>
<text x="1315" y="492" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#111111" text-anchor="start">从失败轨迹归纳可复用的核验方法</text>
<text x="1315" y="526" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#111111" text-anchor="start">经经验核对器审核后入池</text>
<text x="1315" y="570" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#111111" text-anchor="start">后续应用 → 更新质量</text>
<text x="1315" y="605" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#111111" text-anchor="start">结合偏好反馈与执行核对</text>
<text x="1315" y="639" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#111111" text-anchor="start">通过贝叶斯推断更新质量估计</text>
<text x="1315" y="683" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#111111" text-anchor="start">问题积累 → 修订经验</text>
<text x="1315" y="718" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#111111" text-anchor="start">调整方法内容与适用边界</text>
<text x="1315" y="752" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#111111" text-anchor="start">固定案例回放，新版更优才替换</text>
<path d="M630 571 H682" fill="none" stroke="#111111" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1225 571 H1277" fill="none" stroke="#111111" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="255" y="844" width="1410" height="106" fill="#eef3e8" stroke="#548235" stroke-width="2"/>
<rect x="255" y="844" width="190" height="106" fill="#548235" stroke="#548235" stroke-width="2"/>
<text x="350" y="909" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="37" font-weight="700" fill="white" text-anchor="middle">经验池</text>
<text x="478" y="884" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#111111" text-anchor="start">适用条件（何时使用） ＋ 核验方法（如何设计标准）</text>
<text x="478" y="928" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#555555" text-anchor="start">例如：任务有明确输出约束 → 将约束转化为独立、可核验的评分标准</text>
<path d="M365 844 V789" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="391" y="817" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#315795" text-anchor="start">检索复用</text>
<path d="M1555 777 V832" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1582" y="817" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#548235" text-anchor="start">积累／更新</text>
<text x="107" y="1008" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#111111" text-anchor="start">设计重点：</text>
<text x="274" y="1008" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="400" fill="#111111" text-anchor="start">不将一次失败直接归因于经验错误；同时考察经验内容与执行过程。</text>
</svg>
